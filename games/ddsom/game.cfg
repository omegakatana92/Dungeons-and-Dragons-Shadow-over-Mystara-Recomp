# Dungeons & Dragons: Shadow over Mystara (Capcom 1996, CPS-2 arcade board): per-game
# settings read by the cps2recomp toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Dungeons & Dragons: Shadow over Mystara
# What the window is called (the name stays the folder the player's settings are kept under)
title = Dungeons & Dragons: Shadow over Mystara Recomp
id = ddsom
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.ddsom
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `ddsom` is MAME's parent set (Europe 960619); its clones (ddsoma, ddsomb, ddsomj, ddsomjr1, ddsomr1,
# ddsomr2, ddsomr3, ddsomu, ddsomur1) are built from other revisions and are not accepted.
rom_set = ddsom
rom_parent = ddsom
rom_name = Dungeons & Dragons: Shadow over Mystara (Europe 960619)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, eight 512 KiB files: 4 MiB).
# graphics: four files side by side per row (64-bit words): dd2.13m/15m/17m/19m (4 MiB each) make the
# first 16 MiB, then dd2.14m/16m/18m/20m (2 MiB each) make the last 8 MiB (24 MiB in all).
# sound_program: the Z80's ROMs (dd2.01, dd2.02). samples: the QSound chip's (dd2.11m, dd2.12m, 4 MiB).
# key: the board's cipher key.
program = dd2e.03e:449361af dd2e.04e:5b7052b6 dd2e.05e:788d5f60 dd2e.06e:e0807e1e dd2e.07:bb777a02 dd2e.08:30970890 dd2e.09:99e2194d dd2e.10:e198805e
graphics = dd2.13m:a46b4e6e dd2.15m:d5fc50fc dd2.17m:837c0867 dd2.19m:bb0ec21c dd2.14m:6d824ce2 dd2.16m:79682ae5 dd2.18m:acddd149 dd2.20m:117fb0c0
sound_program = dd2.01:99d657e5 dd2.02:117a3824
samples = dd2.11m:98d0c325 dd2.12m:5ea2e7fa
key = ddsom.key:541e425d

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region is 4 MiB (eight 512 KiB ROMs), so this spans the whole program.
code_end = 400000
